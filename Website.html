<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit a Level</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
    input, textarea, button { display: block; width: 100%; margin-top: 12px; padding: 10px; box-sizing: border-box; }
    textarea { height: 180px; font-family: monospace; resize: vertical; }
    button { background: #2ea44f; color: white; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Submit Your Game Level</h2>
  <form action="https://formspree.io/f/xgakajnn" method="POST">
    <input type="text" name="level_name" placeholder="Level Name" required>
    <input type="text" name="creator" placeholder="Your Name" required>
    <textarea name="level_data" placeholder="Paste your level text or code here..." required></textarea>
    <button type="submit">Submit Level</button>
  </form>
</body>
</html>
