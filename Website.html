<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level ID & Link Generator</title>
  <style>
    body { font-family: sans-serif; max-width: 550px; margin: 40px auto; padding: 20px; }
    textarea, input { width: 100%; box-sizing: border-box; font-family: monospace; padding: 10px; margin-top: 8px; }
    textarea { height: 180px; resize: vertical; }
    button { margin-top: 10px; padding: 10px 16px; background: #2ea44f; color: white; border: none; font-weight: bold; cursor: pointer; }
    button.secondary { background: #444; }
    .box { margin-top: 20px; padding: 15px; background: #f6f8fa; border: 1px solid #d0d7de; }
    .hidden { display: none; }
    label { font-weight: bold; display: block; margin-top: 12px; }
  </style>
</head>
<body>

  <div id="createSection">
    <h2>Generate Level ID & Link</h2>
    <textarea id="inputText" placeholder="Paste your plain-text level here..."></textarea>
    <button onclick="generate()">Create Level ID & Link</button>

    <div id="resultBox" class="box hidden">
      <label for="levelId">Level ID:</label>
      <input type="text" id="levelId" readonly>
      <button onclick="copyValue('levelId')">Copy Level ID</button>

      <label for="levelLink">Plain-Text Level Link:</label>
      <input type="text" id="levelLink" readonly>
      <button class="secondary" onclick="copyValue('levelLink')">Copy Link</button>
    </div>
  </div>

  <script>
    function encodeToId(text) {
      const base64 = btoa(unescape(encodeURIComponent(text)));
      return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodeFromId(id) {
      let base64 = id.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      return decodeURIComponent(escape(atob(base64)));
    }

    // If opened with a link (#ID), wipe the page and show ONLY the plain-text level
    const hash = window.location.hash.slice(1);
    if (hash) {
      try {
        const levelText = decodeFromId(hash);
        document.body.innerHTML = '';
        document.body.style.cssText = 'margin: 0; padding: 0; max-width: none;';
        const pre = document.createElement('pre');
        pre.style.cssText = 'margin: 0; font-family: monospace; white-space: pre-wrap; word-wrap: break-word;';
        pre.textContent = levelText;
        document.body.appendChild(pre);
      } catch (e) {
        document.body.textContent = 'Invalid Level ID.';
      }
    }

    function generate() {
      const raw = document.getElementById('inputText').value;
      if (!raw.trim()) return;

      const id = encodeToId(raw);
      const url = `${window.location.origin}${window.location.pathname}#${id}`;

      document.getElementById('levelId').value = id;
      document.getElementById('levelLink').value = url;
      document.getElementById('resultBox').classList.remove('hidden');
    }

    function copyValue(elementId) {
      const el = document.getElementById(elementId);
      el.select();
      navigator.clipboard.writeText(el.value);
    }
  </script>
</body>
</html>
